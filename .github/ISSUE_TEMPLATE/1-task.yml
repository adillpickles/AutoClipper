name: Task
description: A unit of implementation work with clear "done when" checks (the default).
body:
  - type: markdown
    attributes:
      value: |
        Write this so a teammate **or an AI coding agent** with no prior context can finish it. Use a plain, action title (e.g. "Compute chat features for each time window") and no internal codes. Guide: [docs/agents/writing-tasks.md](https://github.com/adillpickles/AutoClipper/blob/main/docs/agents/writing-tasks.md).
        After creating it, add a category label (`frontend`, `backend`, `ingestion`, `data`, `modeling`, `export`, `tooling`), plus `stretch` if it waits for the MVP. See [labels](https://github.com/adillpickles/AutoClipper/blob/main/docs/project/labels.md).
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences. What will be true when this is done, and why it matters for the app.
      placeholder: Turn chat into numbers for every 10-second window, so the baselines and the model have their main signal.
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: What to build
      description: The pieces, in plain words, with likely files.
      placeholder: |
        - `src/autoclipper/features/chat.py`: message rate, unique chatters and emote rate per window.
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Concrete, checkable outcomes (inputs → expected outputs, edge cases), including tests.
      placeholder: |
        - [ ] Every window gets a value; windows with no messages get 0, not null.
        - [ ] Unit tests cover empty chat, a single message and a message exactly on a window boundary.
    validations:
      required: true
  - type: textarea
    id: depends_on
    attributes:
      label: Depends on
      description: Issues that must be merged before this one can start, as "#N Title". Write "Nothing" if it can start now.
      placeholder: "#22 Split each VOD into time windows and group viewer clips into moments"
    validations:
      required: true
  - type: textarea
    id: not_included
    attributes:
      label: Not included
      description: What's deliberately left for another issue.
      placeholder: Features from later windows (lead/lag); CLI wiring.
  - type: textarea
    id: check
    attributes:
      label: How to check
      description: The command or steps that prove it works.
      placeholder: uv run pytest tests/features
    validations:
      required: true
  - type: textarea
    id: reading
    attributes:
      label: Background reading
      description: Only the doc sections that matter.
      placeholder: |
        - `docs/ml/features.md` § Chat features
