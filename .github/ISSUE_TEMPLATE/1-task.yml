name: Task
description: A unit of implementation work with clear acceptance criteria (the default).
title: "<type>(<scope>): <short imperative summary>"
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Write this so a contributor **or an AI coding agent** with no prior context can finish it.
        Guide: [docs/agents/writing-tasks.md](https://github.com/adillpickles/AutoClipper/blob/main/docs/agents/writing-tasks.md)
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, and why does it matter? 1–3 sentences.
      placeholder: Compute per-window chat message rate so the v1 ranker has its first chat feature.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background, links to relevant docs/ADRs/issues, and any prior attempts.
      placeholder: |
        - Feature definition: docs/ml/features.md § Chat features
        - Window schema: docs/architecture/data-model.md § windows
    validations:
      required: true
  - type: textarea
    id: depends_on
    attributes:
      label: Depends on
      description: Issues that must be merged before this one can start. Write "None" if it can start now.
      placeholder: "#12 (chat ingestion)"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist a reviewer can verify. Be concrete (inputs → expected outputs).
      placeholder: |
        - [ ] `chat_msg_rate` computed for every window in `windows.parquet`
        - [ ] Windows with no messages get 0, not null
        - [ ] Unit tests cover empty chat and a single-message VOD
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Likely files / modules touched
      description: Best guess. Helps avoid conflicts between parallel work.
      placeholder: src/autoclipper/features/chat.py, tests/features/test_chat.py
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Things that might seem related but should NOT be done in this task.
      placeholder: Emote-based features (separate issue). Changing the window size.
  - type: textarea
    id: verify
    attributes:
      label: How to verify
      description: Commands or steps that prove it works.
      placeholder: uv run pytest tests/features/test_chat.py
  - type: dropdown
    id: size
    attributes:
      label: Estimated size
      options:
        - "S (< 2 hours)"
        - "M (half a day to a day)"
        - "L (multiple days, consider splitting)"
    validations:
      required: true
