name: Bug report
description: Something behaves incorrectly.
title: "fix(<scope>): <what is wrong>"
labels: ["type:bug", "status:needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the incorrect behavior. Include the full error / traceback if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands and inputs. Use a VOD/clip ID if relevant. **Don't paste chat logs with real usernames.**
      placeholder: |
        1. uv run autoclipper ingest --video-id 1234567890
        2. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / branch
      placeholder: main @ abc1234
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12.x, FFmpeg 7.x
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Suspected cause, related issues, workarounds.
