name: Experiment
description: An ML experiment with a hypothesis, a metric and a baseline.
title: "Experiment: <hypothesis in a few words>"
labels: ["experiment", "modeling"]
body:
  - type: markdown
    attributes:
      value: |
        Experiments follow [docs/ml/experiments.md](https://github.com/adillpickles/AutoClipper/blob/main/docs/ml/experiments.md).
        **Write the hypothesis and success criterion before running anything.**
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      placeholder: Adding audio loudness features to chat-only features improves hit rate@10.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Dataset version, split, features, model, and what changes vs. the reference run.
      placeholder: |
        - Dataset: dataset v1, fold 0 (split file: data/splits/v1.json)
        - Reference: exp-003 (chat-only LightGBM)
        - Change: + audio_rms_mean, audio_rms_max_z
    validations:
      required: true
  - type: textarea
    id: metric
    attributes:
      label: Primary metric and success criterion
      description: One primary metric, decided in advance. See docs/ml/evaluation.md.
      placeholder: Hit rate@10 on the validation split; success = +0.05 over reference, with a bootstrap 95% CI excluding 0.
    validations:
      required: true
  - type: textarea
    id: baselines
    attributes:
      label: Baselines to compare against
      placeholder: random, chat_spike, loudness, chat_loudness, reference run exp-003
    validations:
      required: true
  - type: textarea
    id: budget
    attributes:
      label: Time / compute budget
      placeholder: ≤ 1 day; runs on a laptop CPU.
