  # 2026-11-06, so its VODs give no viewer-clip labels. Every selected loltyler1 VOD has viewer
  # clips with VOD offsets. The one ingested flight23white VOD is kept as a zero-clip case.
  # No stacked_layout preset yet: the pilot collected audio only, so no frame was measured.
  - login: loltyler1
