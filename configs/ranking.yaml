# Ranking rules for the default chat_loudness ranking (#192; docs/ml/modeling-plan.md § 3,
# autoclipper.models.ranking_rules).
#
# Windows that only look busy (the stream's start and end, silent audio, greeting/farewell waves,
# answer spam) are down-weighted, never dropped: each matching rule multiplies the window's
# height above the VOD's median score by its factor (0.5 keeps half; two rules keep a quarter).
# Keys left out keep the built-in defaults, which equal this file. These values are first guesses
# from the demo VOD; tune them on dataset v1 validation (#40), never on test.
version: 1

enabled: true

# The first and last few minutes ("starting soon", "hi", "LATE", "bye"). Skipped for VODs no
# longer than intro_s + outro_s.
intro_s: 180
outro_s: 180
edge_factor: 0.5

# Near-digital silence: at least this share of the window's frames below -60 dBFS
# (audio_silence_frac). Music muted out of a VOD shows up only like this.
silence_frac_min: 0.95
silence_factor: 0.5

# Greeting/farewell waves at the stream's start and end (first intro_s / last outro_s seconds
# only, whole-message greetings and farewells from the lexicon): at least this share of messages.
# A mid-stream "BYE BYE" kill wave or an outraged "HEY" is a reaction and is never flagged.
participation_frac_min: 0.25
participation_factor: 0.5

# Answer spam (chat-guessing games): at least answer_frac_min of the messages are different short
# reaction-free answers (chat_answer_frac), in a window busy for its VOD (at least answer_min_msgs
# messages, answer_min_msg_rate msg/s and the VOD's answer_rate_quantile chat rate).
# OFF by default (answer_factor 1.0): a small channel's reactive chat ("bro what", "no shot") is
# answer-shaped too. Enable it (e.g. 0.5) only after tuning on dataset v1 validation (#40).
answer_frac_min: 0.7
answer_min_msg_rate: 2.0
answer_min_msgs: 40
answer_rate_quantile: 0.9
answer_factor: 1.0

# The result warns (audio_partly_silent) when at least this many seconds of audio are silent.
silent_warning_min_s: 60
