# Chat reaction lexicon and clip-link filter for chat features (docs/ml/features.md § Chat).
#
# Bump `version` whenever a list changes: it is part of the chat features' `feature_version`,
# so features computed with different lists are never mixed.
#
# Each category matches a message when any entry matches:
#   emotes:   emote names: whole tokens in exact case, optional trailing punctuation ("W!");
#             emoji anywhere in the message
#   words:    words or phrases, any case, on word boundaries ("lol", "lets go")
#   patterns: regular expressions (Rust regex syntax, as Polars uses), any case unless the
#             pattern says otherwise
version: 2

# `laugh`, `hype`, `shock` and `keyword` are reactions (chat_<category>_rate). `greeting` and
# `farewell` (optional sections) are participation, not reactions: "hi", "LATE", "bye" waves at
# a stream's start and end look like hype by volume alone (chat_greeting_rate,
# chat_farewell_rate; docs/ml/features.md). They match WHOLE messages only: the message must be
# made of these entries alone, repeated or with punctuation ("hi chat", "bye bye", "LATE!!"), so
# "hey what was that" or "he said bye" is not a greeting or farewell. Their patterns are tokens
# of such a message, not searches.
categories:
  greeting:
    emotes: [HeyGuys, VoHiYo, peepoHey, peepoHi, HiHi]
    words: [hi, hello, hey, hiya, howdy, yo chat, hi chat, hey chat, hello chat, good morning, gm, wassup, whats up, sup chat]
    # "late" / "im late" / "early" / "first" / "here" check-ins, and stretched greetings.
    patterns: ['(?:i''?m\s+)?(?:late|early|first|here)\b', 'hi{2,}\b', 'he+y{2,}\b', 'hel{2,}o+\b']
  farewell:
    emotes: [peepoBye, Bye, ByeBye]
    words: [bye, goodbye, good night, goodnight, gn, gn chat, cya, see ya, see you, see you tomorrow, peace out, bye chat]
    patterns: ['by+e{2,}\b', 'ba+i+\b']
  laugh:
    emotes: [KEKW, OMEGALUL, LUL, LULW, KEKL, ICANT, "😂", "🤣"]
    words: [lol, lmao, lmfao, rofl, haha, hahaha]
    patterns: ['\b(?:ha){3,}\b', '\bl+o+l+(?:o+l+)*\b', '\blma+o+\b']
  hype:
    emotes: [POG, Pog, PogChamp, PogU, POGGERS, Poggers, W, EZ, "🔥"]
    words: [lets go, let's go, letsgo, clutch, insane, huge]
    patterns: ['!{3,}', '\blet+s+\s*go+\b']
  shock:
    emotes: [monkaS, monkaW, "D:", WAYTOODANK, Sadge, "😱", "😳"]
    words: [wtf, no way, omg, bruh, holy]
    patterns: ['^\s*\?+\s*$', '\bno+\s+wa+y+\b']
  # chat_keyword_rate: the small "this is a moment" list.
  keyword:
    emotes: [OMEGALUL, KEKW, W, Pog]
    words: [clip it, clip that, clipped, lol, lets go]
    patterns: []

# Answer spam (chat_answer_frac): a message of at most this many whitespace tokens and characters,
# with no reaction, emote, greeting/farewell or event, that nobody else sent in the same window.
answers:
  max_tokens: 3
  max_chars: 25

# Chat events (subs, gifted subs, raids), counted in chat_event_count. Cheers come from the
# `bits` column instead.
events:
  patterns:
    - '\bsubscribed (?:at|with)\b'
    - '\bgifted (?:a|\d+) (?:tier \d )?subs?\b'
    - '\bgifted \d+ months? of tier\b'
    - '\bis gifting \d+ tier \d subs?\b'
    - '\braiders? from\b'
    - '\bis raiding\b'

# Messages that give a clip away. Whole messages matching any pattern are removed before every
# chat aggregate, at training and at inference.
clip_filter:
  patterns:
    - 'clips\.twitch\.tv/'
    - 'twitch\.tv/(?:[A-Za-z0-9_]+/)?clip/'
    - '\bcreated a clip\b'
    - '\bclip created\b'
